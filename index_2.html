<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#312F30">
  <meta name="recursos-version" content="2026.10.26.19">
  <meta name="description" content="Recursos | Arley Zarate. Herramientas y archivos con búsqueda en tiempo real.">
  <title>Recursos | Arley Zarate</title>
  <!-- La interfaz esencial es visible desde el primer renderizado. -->
  <style>
    :root {
      color-scheme: dark;
      --fondo: #312F30;
      --fondo-alt: #1d1f22;
      --panel: rgba(25, 29, 34, .90);
      --panel-solido: #171b20;
      --panel-secundario: rgba(255,255,255,.045);
      --texto: #f3efe7;
      --texto-suave: #d8d2c6;
      --texto-apagado: #a8b2ba;
      --texto-contraste: #111417;
      --borde: rgba(255,255,255,.12);
      --borde-fuerte: rgba(235, 91, 56, .40);
      --acento: #eb5b38;
      --acento-2: #347ccb;
      --acento-3: #e6e4dc;
      --boton: rgba(235, 91, 56, .18);
      --boton-hover: rgba(235, 91, 56, .32);
      --exito: #8ff3c0;
      --error: #ffb4a7;
      --info: #d2d9df;
      --lluvia: rgba(230, 228, 220, .58);
      --lluvia-brillo: #fff6ef;
      --lluvia-sombra: rgba(235, 91, 56, .24);
      --marca: #ffffff;
      --seleccion: rgba(255,255,255,.08);
      --resaltado: #fff0cf;
      --firma-referencia-stroke: var(--panel);
      --firma-contorno-stroke: var(--borde-fuerte);
      --firma-hueco-borde: var(--borde-fuerte);
      --firma-hueco-relleno: var(--fondo);
      --fuente-ui: "Bahnschrift Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", "Roboto Condensed", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      --fuente-mono: Consolas, "Cascadia Code", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--fondo);
      /* Cambio atómico: evita letras oscuras sobre fondos aún oscuros. */
      transition: none;
      color: var(--texto);
      font-family: var(--fuente-ui);
      overflow-x: hidden;
      position: relative;
    }
    /* Capa fotográfica no esencial: nunca cubre ni bloquea el buscador.
       La foto se dimensiona una vez como cover y se desplaza solo por transform. */
    .fondo-imagen {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      pointer-events: none; opacity: 0; visibility: hidden;
      transition: opacity .85s ease;
    }
    .fondo-foto {
      position: absolute; top: 0; left: 0; display: block;
      background-position: center; background-size: 100% 100%;
      background-repeat: no-repeat; will-change: auto;
    }
    @media (prefers-reduced-motion: reduce) {
      .fondo-imagen { transition: none; }
    }
    .pagina {
      min-height: 100svh; position: relative; z-index: 2;
      padding: clamp(18px, 3vw, 45px);
      display: grid; grid-template-rows: auto 1fr auto;
    }
    .cabecera, .pie { font-size: 11px; font-weight: 700; letter-spacing: .19em; color: var(--texto-suave); }
    .cabecera { display: flex; align-items: center; gap: 10px; }
    .logotipo {
      display: grid; place-items: center; width: 29px; height: 29px;
      border: 1px solid var(--borde-fuerte); border-radius: 9px; color: var(--marca);
      background: color-mix(in srgb, var(--panel-solido) 86%, var(--acento) 14%); font-size: 14px;
    }
    .centro { width: min(690px, 100%); justify-self: center; align-self: center; transform: translateY(-8%); }
    h1 {
      margin: 0 0 48px; text-align: center;
      font-size: clamp(48px, 8vw, 88px); line-height: 1.05;
      font-weight: 700; letter-spacing: -.062em;
      text-shadow: 0 9px 38px rgba(0,0,0,.36);
    }
    .comandos {
      position: relative; display: flex; align-items: center; gap: 12px;
      min-height: 79px; padding: 8px 12px;
      border: 1px solid var(--borde-fuerte); border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 20px 64px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.06), 0 0 0 1px color-mix(in srgb, var(--acento) 12%, transparent);
      backdrop-filter: blur(13px);
    }
    .etiqueta {
      position: absolute; left: 22px; top: -13px;
      padding: 5px 11px; background: color-mix(in srgb, var(--panel-solido) 85%, var(--acento) 15%);
      border: 1px solid var(--borde-fuerte); border-radius: 7px;
      color: var(--marca); box-shadow: 0 7px 18px rgba(0,0,0,.4);
      font: 700 11px/1.2 var(--fuente-mono); letter-spacing: .07em;
      animation: flotar 3.8s ease-in-out infinite;
    }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .simbolo { padding-left: 13px; font: 800 25px var(--fuente-mono); color: var(--acento-lectura); }
    #comando {
      min-width: 0; flex: 1; padding: 12px 3px; background: transparent;
      outline: none; border: none; color: var(--texto); caret-color: var(--acento);
      font: 700 clamp(16px, 2vw, 19px)/1.1 var(--fuente-ui); letter-spacing: .02em; text-transform: none;
    }
    #comando::placeholder { color: var(--texto-apagado); opacity: 1; }
    .abrir {
      flex: 0 0 auto; width: 48px; height: 48px;
      border-radius: 11px; border: 1px solid var(--borde-fuerte);
      background: var(--boton); color: var(--marca);
      font-size: 21px; cursor: pointer; transition: background .2s ease;
    }
    .abrir:hover, .abrir:focus-visible { background: var(--boton-hover); outline: 2px solid color-mix(in srgb, var(--acento) 58%, transparent); }
    .estado {
      min-height: 28px; padding-top: 12px; text-align: center;
      font: 700 13px/1.35 var(--fuente-ui); text-transform: none; letter-spacing: .025em;
      color: transparent;
      text-shadow: 0 2px 15px rgba(0,0,0,.6);
    }
    .estado.correcto { color: var(--exito); }
    .estado.error { color: var(--error); }
    .pie { font-size: 10px; text-align: left; letter-spacing: .08em; font-weight: 600; }
    @media (max-width: 560px) {
      .pagina { padding: 20px 15px; }
      .centro { transform: translateY(-5%); }
      h1 { margin-bottom: 42px; }
      .comandos { min-height: 67px; padding: 7px; gap: 6px; }
      .etiqueta { left: 15px; }
      .simbolo { padding-left: 9px; }
      .abrir { width: 43px; height: 43px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .etiqueta { animation: none; }
      body { transition: none; }
    }
  
    /* La interfaz deja solamente el nombre, el comando y los resultados. */
    .pagina { display: flex; align-items: center; justify-content: center; }
    .centro { width: min(720px,100%); align-self: auto; justify-self: auto; transform: translateY(-7%); position:relative; isolation:isolate; }
    /* Velo monocromático local para diferenciar la firma de las columnas traseras. */
    .centro::before {
      content:""; position:absolute; inset:-45px 0; z-index:-1; pointer-events:none;
      background: radial-gradient(ellipse at center, var(--fondo) 17%, transparent 76%);
    }
    .comandos { z-index: 3; }
    .etiqueta { display: none; }
    #comando { position: relative; z-index: 1; }
    .indicacion {
      position: absolute; pointer-events: none; user-select: none;
      left: 64px; right: 69px; top: 50%; transform: translateY(-50%);
      font: 700 clamp(16px, 2vw, 19px)/1.1 var(--fuente-ui);
      color: var(--texto-apagado); text-transform: none; letter-spacing: .02em; white-space: nowrap; overflow: hidden;
    }
    .cursor-parpadeo { color: var(--acento-lectura); font-family: var(--fuente-mono); font-weight: 700; animation: parpadear 1s steps(1) infinite; }
    @keyframes parpadear { 0%, 49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .indicacion.oculta { display: none; }
    .etiqueta-oculta { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .panel-resultados { position: relative; z-index: 2; }
    .resultados {
      position: absolute; top: 8px; left: 0; right: 0;
      max-height: min(330px, 44vh); overflow-y: auto;
      background: color-mix(in srgb, var(--panel-solido) 92%, transparent); border: 1px solid var(--borde-fuerte);
      border-radius: 15px; padding: 7px;
      box-shadow: 0 16px 54px rgba(0,0,0,.53); backdrop-filter: blur(18px);
      scrollbar-color: color-mix(in srgb, var(--acento) 50%, #3f4b52) transparent;
    }
    .resultados[hidden], .modal[hidden] { display: none !important; }
    .resultado {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: var(--texto); background: transparent; border: none; border-radius: 9px;
      cursor: pointer; font: 700 14px/1.28 var(--fuente-ui); text-transform: none; letter-spacing: .015em;
      text-align: left; padding: 10px 12px;
    }
    .resultado:hover, .resultado.activo { background: var(--seleccion); }
    .resultado .archivo { min-width: 0; overflow: hidden; overflow-wrap: anywhere; }
    .resultado .nombre { display: block; }
    .resultado .ubicacion { display: block; margin-top: 4px; color: var(--texto-apagado); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: none; }
    .resultado mark { color: var(--texto-contraste); background: color-mix(in srgb, var(--resaltado) 84%, white 16%); border-radius: 3px; padding: 0 2px; }
    .resultado .accion { color: var(--acento-lectura); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .estado { min-height: 31px; }
    .estado.info { color: var(--info); }
    .modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px; background: rgba(0,0,0,.58); backdrop-filter: blur(8px); }
    .cuadro-modal { width: min(460px,100%); padding: 27px; border-radius: 19px; border: 1px solid var(--borde-fuerte); background: var(--panel-solido); box-shadow: 0 18px 70px rgba(0,0,0,.35); }
    .cuadro-modal h2 { margin: 0 0 12px; font-size: 21px; line-height: 1.15; font-weight: 800; font-family: var(--fuente-ui); text-transform: none; letter-spacing: .015em; }
    .cuadro-modal p { line-height: 1.5; font-size: 15px; overflow-wrap: anywhere; color: var(--texto-suave); }
    .botones-modal { display: flex; gap: 11px; justify-content: flex-end; margin-top: 25px; }
    .botones-modal button { padding: 11px 17px; border-radius: 9px; border: 1px solid var(--borde); font: 800 14px var(--fuente-ui); color: var(--texto); background: color-mix(in srgb, var(--panel-solido) 86%, var(--acento-2) 14%); cursor: pointer; text-transform: none; letter-spacing: .015em; }
    .botones-modal .confirmar { background: var(--acento); color: var(--texto-contraste); border-color: color-mix(in srgb, var(--acento) 70%, black 30%); }
    .botones-modal button:focus-visible, .resultado:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
    @media (max-width:560px) {
      .centro { transform: translateY(-6%); }
      .indicacion { left: 49px; right: 55px; }
      .resultado { padding: 10px 8px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { .cursor-parpadeo { animation: none; } }
    /* La barra es esencial: nunca se oculta esperando una animación de entrada. */
    .comandos { overflow: hidden; animation: none; }
    .comandos::after { display: none; }
    .comandos > * { z-index: 1; }

    /* Firma Fourier autónoma: legible con los grupos cromáticos. */
    .titulo-firma {
      position: relative; width: 100%; height: auto; aspect-ratio: 1000 / 260;
      margin: 0 0 clamp(8px, 1.7vw, 16px);
      line-height: 1; font-size: inherit; overflow: hidden; isolation: isolate;
    }
    .firma-svg {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      pointer-events: none; overflow: visible; transition: opacity .4s ease;
    }
    /* Opción 02: firma tipográfica Inter Display (Arley Bold, Zarate Regular).
       Letras vectoriales en un solo color, con huecos reales y trazo consistente.
       La punta Fourier recorre el perímetro del diseño, sin alterar sus 66 brazos. */
    #firma-contorno { display: none; }
    #firma-referencia { opacity: 1; filter: none; }
    #firma-referencia > path {
      fill: var(--borde-fuerte); stroke: none; fill-rule: nonzero;
    }
    .titulo-firma.trazo-activo #firma-referencia { opacity: 1; }
    /* El mecanismo completo usa la pantalla, nunca el rectángulo del nombre. */
    #firma-escena {
      position: fixed; inset: 0; display: block; width: 100%; height: 100%;
      pointer-events: none; z-index: 4; opacity: 0;
    }
    #firma-escena.animacion-lista { opacity: 1; }
    .titulo-firma { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      #firma-escena { display: none; }
      #firma-contorno, #firma-referencia, .titulo-firma.trazo-activo #firma-contorno, .titulo-firma.trazo-activo #firma-referencia {
        opacity: 1 !important; transition: none;
      }
    }

    .resultado .nombre, .estado, .cuadro-modal h2, .botones-modal button, .indicacion, #comando { font-family: var(--fuente-ui); }
    .resultado .nombre { font-weight: 800; }
    .indicacion { font-stretch: condensed; font-weight: 800; }
    .comandos:focus-within { border-color: var(--acento); }
    #firma-referencia path { paint-order: stroke; }
    .tema-claro .resultado .accion, .tema-claro .simbolo { text-shadow: none; }
    .tema-claro .cuadro-modal, .tema-claro .resultados, .tema-claro .comandos {
      box-shadow: 0 20px 58px rgba(27, 32, 41, .12), inset 0 1px rgba(255,255,255,.32);
    }
    .tema-claro #comando, .tema-claro .estado, .tema-claro .resultado, .tema-claro .cuadro-modal h2 { text-shadow: none; }
    @media (max-width: 600px) {
      .comandos, .resultados { backdrop-filter: none; }
      .resultados { box-shadow: 0 14px 32px rgba(0,0,0,.20); }
    }


    /* Portal sobrio: sin letras verticales. Firma Fourier independiente del buscador. */
    .pagina { display: block; position: static; z-index: auto; padding: 0; min-height: 100svh; }
    .titulo-firma {
      position: fixed; right: calc(clamp(12px, 2.3vw, 30px) + var(--firma-vista-derecha, 0px));
      left: auto; top: calc(clamp(12px, 1.6vw, 24px) + var(--firma-vista-superior, 0px));
      z-index: 2; width: min(360px, calc(50vw - 16px));
      height: auto; margin: 0; pointer-events: none; overflow: visible;
    }
    /* Escritorio: barra en el tercer cuarto de la altura. Móvil: al borde inferior. */
    .centro {
      position: fixed; z-index: 5; left: 50%; top: var(--buscador-y, 75dvh);
      transform: translate(-50%, -50%) !important;
      transition: top .32s cubic-bezier(.2,.75,.2,1);
      width: min(720px, calc(100vw - 32px));
      margin: 0; isolation: initial; align-self: auto;
    }
    .centro::before { display: none; }
    .comandos { overflow: hidden; }
    /* Las sugerencias se despliegan hacia arriba y nunca detrás del teclado. */
    .panel-resultados {
      position: absolute; bottom: calc(100% + 10px); top: auto;
      left: 0; right: 0; z-index: 6;
    }
    .resultados {
      position: relative; top: auto; left: auto; right: auto;
      max-height: var(--resultados-alto, min(330px, 40dvh));
      overflow-y: auto; overscroll-behavior: contain;
      box-shadow: 0 -16px 40px rgba(0,0,0,.22);
    }
    .estado { pointer-events: none; }
    .indicacion { overflow: hidden; text-overflow: clip; }
    @media (max-width: 700px) {
      .centro { top: var(--buscador-y, calc(100dvh - 64px)); }
       .titulo-firma { width: min(360px, calc(50vw - 18px)); }
      .comandos { min-height: 62px; }
      #comando { font-size: 16px; }
      .indicacion { font-size: clamp(14px, 4vw, 18px); }
      .resultados { max-height: var(--resultados-alto, min(46dvh, 340px)); }
      .estado { min-height: 20px; padding-top: 6px; font-size: 11px; }
    }

    /* El buscador mantiene la pista de texto o muestra un alcance real por carpeta. */
    .alcance-actual { display:flex; align-items:center; flex:0 1 auto; gap:8px;
      min-width:0; white-space:nowrap; color:var(--texto-apagado);
      font:800 clamp(12px,1.6vw,16px)/1.1 var(--fuente-ui); text-transform:none; }
    .alcance-actual[hidden] { display:none !important; }
    .carpeta-etiqueta { display:inline-flex; align-items:center; gap:6px; min-width:0; max-width:210px;
      color:var(--acento-lectura); background:color-mix(in srgb,var(--acento) 12%,transparent);
      border:1px solid var(--borde-fuerte); border-radius:9px;
      padding:7px 8px; font:inherit; font-weight:800; cursor:pointer; }
    .carpeta-etiqueta:focus-visible { outline:2px solid var(--acento); outline-offset:2px; }
    #nombre-carpeta { display:block; max-width:175px; overflow:hidden; text-overflow:ellipsis; }
    .carpeta-etiqueta .quitar { font-size:18px; line-height:1; }
    .comandos.con-alcance #comando { flex:1 1 50px; min-width:34px; }
    .resultado.tipo-carpeta { border-left:2px solid var(--borde-fuerte); }
    .resultado.tipo-carpeta .accion { white-space:nowrap; }
    @media (max-width:600px) {
      .alcance-actual { gap:5px; font-size:12px; }
      .carpeta-etiqueta { padding:6px; max-width:120px; }
      #nombre-carpeta { max-width:89px; }
      .comandos.con-alcance { gap:5px; }
      .comandos.con-alcance .simbolo { padding-left:5px; }
      .comandos.con-alcance #comando { padding-inline:0; font-size:14px; }
    }
    @media (max-width:360px) {
      .comandos.con-alcance { gap:3px; padding-inline:5px; }
      .comandos.con-alcance .simbolo { padding-left:2px; font-size:21px; }
      .comandos.con-alcance .abrir { width:38px; height:41px; }
      .alcance-actual { gap:3px; font-size:11px; }
      .carpeta-etiqueta { gap:3px; max-width:117px; padding:5px; }
      #nombre-carpeta { max-width:94px; }
      .comandos.con-alcance #comando { min-width:23px; flex-basis:25px; font-size:13px; }
    }
    @media (prefers-reduced-motion:reduce) { .centro { transition:none !important; } }

</style>
</head>
<body>
  <div id="fondo-imagen-a" class="fondo-imagen" aria-hidden="true"><div class="fondo-foto"></div></div>
  <div id="fondo-imagen-b" class="fondo-imagen" aria-hidden="true"><div class="fondo-foto"></div></div>
  <!-- Los catálogos auxiliares no bloquean la primera pintura de la interfaz. -->
  <script src="archivos.js" async onload="window.dispatchEvent(new Event('recursos:config-cargada'))"></script>
  <script src="extensiones.js" async onload="window.dispatchEvent(new Event('recursos:config-cargada'))"></script>
  <canvas id="firma-escena" aria-hidden="true"></canvas>
  <!-- Firma anclada directamente a la ventana, separada del buscador móvil. -->
  <h1 id="firma" class="titulo-firma" aria-label="Arley Zarate">

const STROKES=[[0, 2048]];
const TAU=Math.PI*2, M=2048, DURACION=21; // Ida y regreso: 10,5 segundos cada uno.
const contenedor=document.getElementById('firma');
 const canvas=document.getElementById('firma-escena');
if(!contenedor || !canvas || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.documentElement.classList.remove('recursos-preparando');return;
}
const ctx=canvas.getContext('2d',{alpha:true});
if(!ctx){document.documentElement.classList.remove('recursos-preparando');return;}
let W=0,H=0,dpr=1,escala=1,dx=0,dy=0;
let origenX=0,origenY=0,maquina=[],px,py;
let ciclo=-1,sentido=-1,t0=0,ultimoFotograma=0,raf=0,ocultaDesde=0,presentada=false,ultimoIndice=0;
const intervaloFotograma=window.innerWidth < 600 ? 1000/30 : 1000/45;
const anillosReutilizables=Array.from({length:66},()=>({x:0,y:0,nx:0,ny:0,r:0}));
function decode(b64){let binary=atob(b64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Float32Array(bytes.buffer)}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(devicePixelRatio||1,window.innerWidth<600?1.15:1.45);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  sincronizarGeometriaFirma();
}
function sincronizarGeometriaFirma(){
  const r=contenedor.getBoundingClientRect();
  escala=Math.min(r.width/1000,r.height/260,1.7);
  dx=r.left+(r.width-1000*escala)/2;
  dy=r.top+(r.height-260*escala)/2;
}
window.__sincronizarGeometriaFirma=sincronizarGeometriaFirma;
addEventListener('resize',resize,{passive:true});
function init(){try{
const cc=decode(COEFF), p=decode(PATHS);
for(let i=0;i<cc.length;i+=3){let k=cc[i],r=cc[i+1],im=cc[i+2];maquina.push({freq:k,r:Math.hypot(r,im),angle:Math.atan2(im,r)})}
origenX=508.7726745605;origenY=143.1480102539;
px=new Float32Array(M+1);py=new Float32Array(M+1);for(let i=0;i<=M;i++){px[i]=p[2*i];py[i]=p[2*i+1]}
resize();contenedor.classList.add('trazo-activo');t0=performance.now();
raf=requestAnimationFrame(frame);
}catch(e){/* La interfaz y la firma SVG siguen visibles sin el mecanismo. */}}
function begin(c,d){
  ciclo=c;sentido=d;
  if(d===0)window.dispatchEvent(new CustomEvent('firma:nuevo-ciclo',{detail:{ciclo:c}}));
}
// Firma Fourier: 66 brazos animados sin las circunferencias orbitales.
// Se conservan todos los coeficientes, los puntos del trazo y la ida/regreso.
// El nuevo contorno tipográfico mantiene los coeficientes recalculados para
// que el mecanismo siga el perímetro de la firma con el mismo ciclo y brazos.
function mecanismo(fase,index){let x=origenX,y=origenY;
  const limite=Math.min(maquina.length,66);
  for(let i=0;i<limite;i++){
    const c=maquina[i],a=TAU*fase*c.freq+c.angle;
    const nx=x+c.r*Math.cos(a),ny=y+c.r*Math.sin(a);
    const q=anillosReutilizables[i];
    q.x=x;q.y=y;q.nx=nx;q.ny=ny;q.r=c.r;
    x=nx;y=ny;
  }
  return {x:px[index],y:py[index],cx:x,cy:y,cs:anillosReutilizables,limite};
}
let colorBrazos='#FFD85E', fondoArticulacion='#0E0F0B';
function actualizarTonosBrazos(){
  const estilo=getComputedStyle(document.documentElement);
  colorBrazos=estilo.getPropertyValue('--borde-fuerte').trim() || '#FFD85E';
  fondoArticulacion=estilo.getPropertyValue('--panel').trim() || '#0E0F0B';
}
actualizarTonosBrazos();
addEventListener('recursos:cambio-paleta',actualizarTonosBrazos);
function dibujarBrazos(p){
  // Cachear tonos de la paleta: sin lectura de estilos por fotograma.
  const color=colorBrazos;
  const fondo=fondoArticulacion;
  const uniones=[];
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.globalAlpha=.8;
  ctx.strokeStyle=color;
  let lx=origenX,ly=origenY;
  for(let i=0;i<p.limite;i++){
    const q=p.cs[i];
    lx=q.nx;ly=q.ny;
    if(q.r*escala<.65)continue;
    ctx.lineWidth=i<8?4.2:2.9;
    ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.nx,q.ny);ctx.stroke();
    if(i<10 && q.r*escala>10)uniones.push({x:q.nx,y:q.ny,r:i<4?4.5:3.7});
  }
  ctx.lineWidth=4.3;
  ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();
  // Articulaciones rellenas con el MISMO fondo de las letras. No emiten chispas.
  ctx.globalAlpha=1;
  ctx.fillStyle=fondo;
  for(const punto of uniones){
    ctx.beginPath();ctx.arc(punto.x,punto.y,punto.r,0,TAU);ctx.fill();
    ctx.globalAlpha=.8;
    ctx.lineWidth=1.35;ctx.stroke();
    ctx.globalAlpha=1;
  }
  // Punta identificable, sin brillo ni partículas.
  ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,TAU);ctx.fill();
  ctx.globalAlpha=.8;ctx.lineWidth=1.35;ctx.stroke();
  ctx.restore();
}
function frame(time){
  raf=requestAnimationFrame(frame);
  const intervalo=document.activeElement?.id==='comando'?1000/15:intervaloFotograma;
  if(document.hidden || time-ultimoFotograma<intervalo)return;
  ultimoFotograma=time;
  const sec=Math.max(0,(time-t0)/1000),real=sec/DURACION,c=Math.floor(real),u=real-c,d=u<.5?0:1;
  if(c!==ciclo||d!==sentido)begin(c,d);
  const progress=d===0?u*2:(1-u)*2;
  const index=Math.min(M,Math.max(0,Math.floor(progress*M)));
  ultimoIndice=index;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.setTransform(dpr*escala,0,0,dpr*escala,dpr*dx,dpr*dy);
  dibujarBrazos(mecanismo(progress*.5,index));
  if(!presentada){
    presentada=true;
    canvas.classList.add('animacion-lista');
  }
}
// Evita calcular y dibujar durante una pestaña oculta.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ocultaDesde=performance.now();cancelAnimationFrame(raf);raf=0;}
  else if(maquina.length){if(ocultaDesde)t0+=performance.now()-ocultaDesde;ocultaDesde=0;
    ultimoFotograma=0;if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);}
});
window.__pruebaFirma={estado:()=>({listo:maquina.length>0,armónicos:maquina.length,círculos:0,
  brazos:Math.min(maquina.length,66),letras:11,segmentos:STROKES.length,
  visible:presentada,tiempoCiclo:DURACION,sentido:sentido===0?'ida':'regreso',
  color:getComputedStyle(document.documentElement).getPropertyValue('--borde-fuerte').trim(),
  indice:ultimoIndice,chispas:0,tonos:[],grosorLetra:0,grosorMecanismo:4.2}),
  avanzar:(s)=>{t0=performance.now()-s*1000;ciclo=-1;sentido=-1;ultimoFotograma=0}};
// Firma estática visible desde el inicio. Animación diferida tras el primer renderizado.
function iniciarDiferido(){
  const ejecutar=()=>{
    if(document.hidden){document.addEventListener('visibilitychange',()=>{
      if(!document.hidden&&!maquina.length){try{init()}catch(_){/* Firma SVG estable. */}}
    },{once:true});return;}
    try{init()}catch(_){/* La firma SVG permanece. */}
  };
  if('requestIdleCallback' in window)requestIdleCallback(ejecutar,{timeout:1700});
  else setTimeout(ejecutar,850);
}
requestAnimationFrame(()=>setTimeout(iniciarDiferido,350));
})();
