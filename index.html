    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--fondo);
      /* Cambio atómico: evita letras oscuras sobre fondos aún oscuros. */
      transition: none;
      color: var(--texto);
      font-family: var(--fuente-ui);
      overflow-x: hidden;
      position: relative;
    }
    /* Capa fotográfica no esencial: nunca cubre ni bloquea el buscador.
       La foto se dimensiona una vez como cover y se desplaza solo por transform. */
    .fondo-imagen {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      pointer-events: none; opacity: 0; visibility: hidden;
      transition: opacity .85s ease;
    }
    .fondo-foto {
      position: absolute; top: 0; left: 0; display: block;
      background-position: center; background-size: 100% 100%;
      background-repeat: no-repeat; will-change: auto;
    }
    @media (prefers-reduced-motion: reduce) {
      .fondo-imagen { transition: none; }
    }
    .pagina {
      min-height: 100svh; position: relative; z-index: 2;
      padding: clamp(18px, 3vw, 45px);
      display: grid; grid-template-rows: auto 1fr auto;
    }
    .cabecera, .pie { font-size: 11px; font-weight: 700; letter-spacing: .19em; color: var(--texto-suave); }
    .cabecera { display: flex; align-items: center; gap: 10px; }
    .logotipo {
      display: grid; place-items: center; width: 29px; height: 29px;
      border: 1px solid var(--borde-fuerte); border-radius: 9px; color: var(--marca);
      background: color-mix(in srgb, var(--panel-solido) 86%, var(--acento) 14%); font-size: 14px;
    }
    .centro { width: min(690px, 100%); justify-self: center; align-self: center; transform: translateY(-8%); }
    h1 {
      margin: 0 0 48px; text-align: center;
      font-size: clamp(48px, 8vw, 88px); line-height: 1.05;
      font-weight: 700; letter-spacing: -.062em;
      text-shadow: 0 9px 38px rgba(0,0,0,.36);
    }
    .comandos {
      position: relative; display: flex; align-items: center; gap: 12px;
      min-height: 79px; padding: 8px 12px;
      border: 1px solid var(--borde-fuerte); border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 20px 64px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.06), 0 0 0 1px color-mix(in srgb, var(--acento) 12%, transparent);
      backdrop-filter: blur(13px);
    }
    .etiqueta {
      position: absolute; left: 22px; top: -13px;
      padding: 5px 11px; background: color-mix(in srgb, var(--panel-solido) 85%, var(--acento) 15%);
      border: 1px solid var(--borde-fuerte); border-radius: 7px;
      color: var(--marca); box-shadow: 0 7px 18px rgba(0,0,0,.4);
      font: 700 11px/1.2 var(--fuente-mono); letter-spacing: .07em;
      animation: flotar 3.8s ease-in-out infinite;
    }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .simbolo { padding-left: 13px; font: 800 25px var(--fuente-mono); color: var(--acento-lectura); }
    #comando {
      min-width: 0; flex: 1; padding: 12px 3px; background: transparent;

    async function pedirJSON(url) {
      // Una conexión detenida no debe bloquear indefinidamente la búsqueda.
      const controlador=typeof AbortController==='function'?new AbortController():null;
      const limite=setTimeout(()=>controlador?.abort(),12000);
      try {
        const respuesta=await fetch(url,{
          headers:{Accept:'application/vnd.github+json'},signal:controlador?.signal
        });
        if (!respuesta.ok) throw new Error('GitHub API: ' + respuesta.status);
        return await respuesta.json();

    async function consultarGitHub() {
      const base = 'https://api.github.com/repos/' + encodeURIComponent(CONFIG_GITHUB.usuario)
        + '/' + encodeURIComponent(CONFIG_GITHUB.repositorio);
      // La API de árboles entrega rutas completas, incluso dentro de subcarpetas.
      const informacion = await pedirJSON(base);
      const rama = CONFIG_GITHUB.rama || informacion.default_branch;
      if (!rama) throw new Error('No se encontró la rama publicada.');
      const urlArbol = base + '/git/trees/';
      const arbol = await pedirJSON(urlArbol + encodeURIComponent(rama) + '?recursive=1');
      let entradas;
      if (!arbol.truncated) {
        entradas = arbol.tree || [];
      } else {
        // En repositorios muy grandes, recorrer subárboles evita resultados incompletos.
        entradas = [];
        const cola = [{ sha: rama, ruta: '' }];
        while (cola.length) {
          const actual = cola.shift();
          const parcial = await pedirJSON(urlArbol + encodeURIComponent(actual.sha));
          if (parcial.truncated || !Array.isArray(parcial.tree)) throw new Error('Árbol de GitHub incompleto.');
          for (const item of parcial.tree) {
            const ruta = actual.ruta ? actual.ruta + '/' + item.path : item.path;
            if (item.type === 'tree') cola.push({ sha: item.sha, ruta });
            if (item.type === 'blob') entradas.push({ ...item, path: ruta });
          }
        }
      }
      const carpeta = CONFIG_GITHUB.carpeta.replace(/^\/+|\/+$/g, '');
      const prefijo = carpeta ? carpeta + '/' : '';
      return entradas.filter(e => e.type === 'blob' && e.mode !== '120000' && e.path.startsWith(prefijo))
        .map(e => e.path.slice(prefijo.length));
    }

      if (!buscado) return null;
      const titulo = normalizar(item.titulo);
      const nombreRuta = normalizar(item.buscar);
      const sinSeparadores = simplificar(consulta);
      if (!titulo.includes(buscado) && !nombreRuta.includes(buscado) &&
          !simplificar(item.buscar).includes(sinSeparadores)) return null;
      if (titulo === buscado) return 0;
      if (titulo.startsWith(buscado)) return 1;
      if (titulo.split(/[\s_\-]+/).some(p => p.startsWith(buscado))) return 2;
      if (titulo.includes(buscado)) return 3;

        return url.href;

    // Solo material estático que se pueda representar sin ejecutar la herramienta.
    // El buscador puede leer imágenes enlazadas, CSS background-image y SVG inline,
    // pero nunca interpreta Canvas, scripts ni construye una marca inventada.
    function logoSVGSeguro(svg){
      if(!svg || svg.querySelectorAll('*').length>140)return null;
      const permitidos=new Set(['svg','g','path','rect','circle','ellipse','line','polyline','polygon',
        'text','tspan','defs','lineargradient','radialgradient','stop','clippath','use']);
      const atributos=new Set(['xmlns','viewbox','width','height','d','x','y','x1','x2','y1','y2',
        'cx','cy','r','rx','ry','points','transform','fill','stroke','stroke-width',
        'stroke-linecap','stroke-linejoin','fill-rule','opacity','fill-opacity',
        'stroke-opacity','font-size','font-weight','font-family','text-anchor',
        'offset','stop-color','stop-opacity','id','href','gradientunits',
        'gradienttransform','spreadmethod']);
      const nuevo=document.createElementNS('http://www.w3.org/2000/svg','svg');
      const copiar=(origen,destino)=>{
        const tag=origen.localName?.toLowerCase();
        if(!permitidos.has(tag))return;
        const nodo=tag==='svg'?destino:document.createElementNS('http://www.w3.org/2000/svg',tag);
        for(const atributo of origen.attributes){
          const nombre=atributo.localName.toLowerCase(),valor=atributo.value.trim();
          if(!atributos.has(nombre)||valor.length>50000||/url\s*\(|javascript:|data:/i.test(valor))continue;
          if(nombre==='href'&&!/^#[\w:-]+$/.test(valor))continue;

        }
        for(const hijo of origen.children)copiar(hijo,nodo);

      copiar(svg,nuevo);
      if(!nuevo.hasAttribute('viewBox')){
        const ancho=parseFloat(nuevo.getAttribute('width')),alto=parseFloat(nuevo.getAttribute('height'));
        if(!(ancho>0&&alto>0))return null;

    // Nunca se ejecutan scripts ni se reproducen estilos o JS de otra aplicación.
    function extraerLogo(doc,item){
      // La primera opción es código vectorial con atributo identificable.
      // Funciona en <svg data-recursos-logo="principal"> y en <template
      // data-recursos-logo> que guarde un SVG estático en su contenido.
      const declarados=[...doc.querySelectorAll('[data-recursos-logo]')].slice(0,24);
      for(const nodo of declarados){
        const svg=nodo.localName?.toLowerCase()==='svg'?nodo:
          (nodo.localName?.toLowerCase()==='template'
            ?nodo.content?.querySelector('svg')
            :nodo.querySelector('svg'));
        if(svg){const valido=logoSVGSeguro(svg);if(valido)return valido;}
      }
      // Segunda opción: recurso gráfico externo etiquetado, sin depender de scripts.
      for(const nodo of declarados){
        const enlace=nodo.getAttribute('src')||nodo.getAttribute('href')||
          nodo.getAttribute('data-recursos-logo-src')||
          nodo.querySelector('img[src]')?.getAttribute('src')||

          nodo.getAttribute('data-recursos-logo')||'';

      }

      const contrato=fichaJSON(doc);
      if(typeof contrato?.logo==='string'){
        const valido=urlLogoSeguro(contrato.logo,item);
        if(valido)return valido;
      }
      const meta=[...doc.querySelectorAll('meta[name]')]
        .find(e=>/^(?:recursos:logo|application-logo)$/i.test(e.getAttribute('name')||''));
      const propuesta=meta?.getAttribute('content');
      if(propuesta){const valido=urlLogoSeguro(propuesta.trim(),item);if(valido)return valido;}
      // Compatibilidad con logos existentes que ya tienen un nombre inequívoco.
      const candidatos=[...doc.querySelectorAll('img[src],svg')].filter(n=>{
        const identidad=[n.id,typeof n.className==='string'?n.className:'',
          n.getAttribute('alt')||'',n.getAttribute('aria-label')||'',
          n.parentElement?.id||'',n.parentElement?.getAttribute('class')||''].join(' ');
        return /logo|logotipo|marca|identidad|isotipo|brand/i.test(identidad)
          && !/footer|pie-de-pagina/i.test(identidad);
      }).slice(0,18);
      for(const nodo of candidatos){
        if(nodo.localName?.toLowerCase()==='img'){
          const valido=urlLogoSeguro(nodo.getAttribute('src'),item);
          if(valido)return valido;
        }else{
          const valido=logoSVGSeguro(nodo);
          if(valido)return valido;
        }

      for(const img of [...doc.querySelectorAll('header img[src], [role="banner"] img[src]')].slice(0,12)){
        if(!simplificar(img.alt||'').includes(nombre))continue;
        const valido=urlLogoSeguro(img.getAttribute('src'),item);

      }
      // Fondo gráfico declarado en línea, no CSS dinámico ni Canvas.
      for(const elemento of [...doc.querySelectorAll('[id],[class]')].slice(0,350)){
        const pista=[elemento.id,typeof elemento.className==='string'?elemento.className:''].join(' ');
        if(!/logo|logotipo|marca|isotipo|brand/i.test(pista))continue;
        const fondo=elemento.getAttribute('style')||'';
        const coincide=fondo.match(/background(?:-image)?\s*:[^;]*?url\(\s*["']?([^"')]+)["']?\s*\)/i);
        if(coincide){const valido=urlLogoSeguro(coincide[1],item);if(valido)return valido;}
      }
      return null;
    }

    // Lectura acotada: 192 KiB para HTML, 24 KiB para LSP; no bloquea el buscador.
    async function leerInicioTexto(url, maximo=24576) {
      const controlador = typeof AbortController==='function' ? new AbortController() : null;
      const temporizador = setTimeout(()=>controlador?.abort(),2600);
      try {
        const respuesta=await fetch(url,{signal:controlador?.signal,cache:'force-cache'});
        if (!respuesta.ok) throw new Error('Recurso no disponible');
        if (respuesta.body?.getReader) {
          const lector=respuesta.body.getReader(), decodificador=new TextDecoder('utf-8');
          let fragmento='',bytes=0;
          try {
            while(bytes<maximo){
              const paso=await lector.read();if(paso.done)break;
              bytes+=paso.value.byteLength;
              fragmento+=decodificador.decode(paso.value.slice(0,Math.max(0,maximo-(bytes-paso.value.byteLength))),{stream:true});
              if(bytes>=maximo)break;
            }
          } finally { void lector.cancel().catch(()=>{}); }
          return fragmento;
        }
        return (await respuesta.text()).slice(0,maximo);
      } finally {clearTimeout(temporizador);}

        .replace(/\n[ \t]*/g,'\n').replace(/\n{3,}/g,'\n\n')

    function contenidoTitulado(doc,expresion) {
      const candidatos=[];
      const partes=[...doc.querySelectorAll('dialog,[role="dialog"],[id],[class],section,article')];

        const identidad=((elemento.id||'')+' '+(typeof elemento.className==='string'?elemento.className:'')+' '+(elemento.getAttribute('aria-label')||'')).slice(0,220);
        // Evitar elegir un botón o contenedor genérico demasiado grande.
        if(!expresion.test(identidad))continue;

        if(!expresion.test((titulo.textContent||'').slice(0,110)))continue;

        // Examinar ancestros acotados evita leer solo el primer párrafo.

    function resumenLSP(codigo) {
      const lineas=codigo.replace(/^\uFEFF/,'').split(/\r?\n/).slice(0,90);
      const bloques=[];let iniciado=false,enBloque=false,autolispBloque=false,vacios=0;
      for(const linea of lineas){
        const texto=linea.trim();
        if(!texto){if(iniciado&&bloques.length&&++vacios>2)break;continue;}
        vacios=0;
        if(texto.startsWith('/*')){enBloque=true;iniciado=true;}
        if(texto.startsWith(';|')){autolispBloque=true;iniciado=true;}
        if(autolispBloque){
          const limpio=texto.replace(/^;\|/,'').replace(/\|;.*$/,'').trim();
          if(limpio)bloques.push(limpio);
          if(texto.includes('|;'))autolispBloque=false;
        } else if(enBloque){
          const limpio=texto.replace(/^\/\*+/,'').replace(/\*\/$/,'').replace(/^\*\s?/, '').trim();
          if(limpio)bloques.push(limpio);
          if(texto.includes('*/'))enBloque=false;
        } else if(/^;|^\/\//.test(texto)) {
          iniciado=true;const limpio=texto.replace(/^(?:;+|\/\/)\s*/,'').replace(/^[=*_ -]+|[=*_ -]+$/g,'').trim();
          if(limpio)bloques.push(limpio);

        if(bloques.join(' ').length>700)break;
      }
      return bloques.join('\n').slice(0,750);

    function resumenBreveAcerca(texto,nombre=''){

      fuente=fuente.replace(/(?:^|\n)\s*(?:Versi[oó]n|Fecha|Creaci[oó]n|Actualizaci[oó]n|Autor|Diseñ[oó]|Desarrollo|Intenci[oó]n)\s*:?\s*[^\n]*/gi,'\n');

          && !/^(?:diseño realizado por|desarrollado por|autor|fecha|versi[oó]n|creaci[oó]n|actualizaci[oó]n)\s*:/i.test(p));

<script>

(()=>{
  const CAPAS=[document.getElementById('fondo-imagen-a'),document.getElementById('fondo-imagen-b')];

  const OPACIDAD_FOTOGRAFIA=1; // Foto opaca; fondo sólido solo como respaldo de carga.
  const RAIZ='./img/';
  const API='https://api.github.com/repos/arleyzarate/arleyzarate.github.io/contents/img?per_page=100';

  // no altera la rotación. El último número es el ancho real de esa variante,

  function analizarRuta(valor){
    if(typeof valor!=='string')return null;
    const ruta=valor.replace(/\\/g,'/').replace(/^\.\//,'');
    const m=/^img\/([^/]+)$/i.exec(ruta);
    if(!m)return null;
    const nombre=m[1];
    if(!EXT.test(nombre)||!/^[a-z0-9_. -]+$/i.test(nombre)||nombre.includes('..'))return null;
    const num=/^(0*[1-9]\d*)(?=[_. -]|\.)/.exec(nombre);

    if(!Number.isSafeInteger(grupo)||grupo>999999)return null;
    const sinExt=nombre.replace(EXT,'');
    const medidas=/(?:^|[_ .-])(\d{3,6})[xX](\d{3,6})$/i.exec(sinExt);
    const sufijo=/(?:^|[_ .-])(\d{3,6})w?$/i.exec(sinExt);
    const ancho=medidas?Number(medidas[1]):sufijo?Number(sufijo[1]):0;
    const alto=medidas?Number(medidas[2]):0;

    // sin tamaño declarado y no se confunde con los píxeles de ancho.
    if(ancho>32768||alto>32768||ancho>0&&ancho<100||alto>0&&alto<100)return null;

  function integrarRutas(datos,destino){
    for(const dato of Array.isArray(datos)?datos:[]){

      const ruta=valor.includes('/')?valor:'img/'+valor;

        trabajo,
        new Promise(resolve=>{limite=setTimeout(()=>{ctrl?.abort();resolve(null);},maxMs);})
      ]);

  async function obtenerListado(){

    integrarRutas(window.RECURSOS_ARCHIVOS,resultado);
    if(location.protocol==='file:')return resultado;

    // La fórmula temporal usa la cantidad de grupos, no su número máximo.
    return [...mapa.keys()].sort((a,b)=>a-b);

  // Selección inicial independiente según el minuto verificado en internet.

  function seleccionParaFranja(t,n){
    const estado=window.RECURSOS_TRANSICION;
    if(!estado?.iniciado||!Number.isSafeInteger(t)||!Number.isSafeInteger(n)||n<1)return null;
    const totalPaletas=Math.max(1,Number(window.__pruebaPaletas?.total)||1);
    const paleta=modulo(Math.floor(estado.minuto*totalPaletas/60)+t,totalPaletas);
    const imagen=1+modulo(Math.floor(estado.minuto*n/60)+t,n);

  }
  function ordenarPorResolucion(lista){
    const ahorro=!!navigator.connection?.saveData;

    const dpr=Math.min(window.devicePixelRatio||1,ahorro?1:vw<600?1.5:1.75);

    // usar solo innerWidth elegía 480/640 incluso para fotos panorámicas.
    // Ajuste conservador y sin lectura extra de imágenes (importante en 4G).
    const objetivo=Math.round(ahorro?Math.max(vw,vh):
      Math.max(vw,vh)*(vh>vw?1.22:1)*dpr);

    // considerablemente más grande por una diferencia insignificante.

    return [...lista].sort((a,b)=>

      const cerrar=ok=>{

        resolve(ok?{ancho:img.naturalWidth,alto:img.naturalHeight}:null);
      };

        if(!img.naturalWidth||!img.naturalHeight){cerrar(false);return;}
        if(typeof img.decode==='function')img.decode().then(()=>cerrar(true),()=>cerrar(false));

  function calcularRecorte(iw,ih,vw,vh){
    if(!iw||!ih||!vw||!vh)return null;
    const escala=Math.max(vw/iw,vh/ih);
    const ancho=Math.ceil(iw*escala)+1,alto=Math.ceil(ih*escala)+1;

  }
  function detenerPaneo(){
    if(paneo){try{paneo.cancel();}catch(_){}paneo=null;}
    FOTOS.forEach(f=>f.style.willChange='auto');
  }
  function configurarFoto(capa,w,h){
    const imagen=FOTOS[capa],vw=window.innerWidth,vh=window.innerHeight;
    const g=calcularRecorte(w,h,vw,vh);

    imagen.style.width=g.ancho+'px';imagen.style.height=g.alto+'px';
    imagen.style.transform=`translate3d(${g.centroX}px,${g.centroY}px,0)`;
    return g;

    detenerPaneo();

    const sobrante=g.eje==='x'?g.sobraX:g.sobraY;
    if(sobrante<16)return;
    const foto=FOTOS[capa];
    const mover=desplazamiento=>g.eje==='x'
      ?`translate3d(${g.centroX+desplazamiento}px,${g.centroY}px,0)`
      :`translate3d(${g.centroX}px,${g.centroY+desplazamiento}px,0)`;

    const duracionMovimiento=Math.min(22000,Math.max(10000,sobrante/30*1000));

      9000+2*duracionMovimiento,13000+2*duracionMovimiento,
      13000+3*duracionMovimiento,17000+3*duracionMovimiento,
      17000+4*duracionMovimiento];

    }));

      foto.style.willChange='transform';

      paneo.onfinish=()=>{
        if(paneo){paneo=null;foto.style.willChange='auto';}
        foto.style.transform=mover(0);
      };
    }catch(_){foto.style.willChange='auto';foto.style.transform=mover(0);}
  }

    ++revision;detenerPaneo();

      c.style.opacity='0';c.style.visibility='hidden';

    });

  }
  async function mostrarNumero(numero,franja){

      if(variante.ruta===rutaActiva&&capaActiva>=0){
        indiceActivo=numero;franjaMostrada=franja;return;
      }

        anticipo?.ruta===variante.ruta ? anticipo.info : null;
      const info=yaLista || await precargar(variante.ruta);
      if(revision!==id || franjaActual()!==franja)return;
      if(!info)continue;
      const nueva=capaActiva===0?1:0;
      detenerPaneo();

      foto.style.backgroundImage='url("'+variante.ruta+'")';
      const geometria=configurarFoto(nueva,info.ancho,info.alto);
      if(!geometria)continue;
      capa.style.visibility='visible';
      capa.style.opacity=String(OPACIDAD_FOTOGRAFIA);
      if(capaActiva>=0){
        const antigua=CAPAS[capaActiva],fotoAntigua=FOTOS[capaActiva];
        antigua.style.opacity='0';

  async function sincronizar(consultar=false){

    const elegida=seleccionParaFranja(f,ids.length);
    if(!elegida)return;
    const grupoElegido=ids[elegida.imagen-1];
    if(franjaMostrada!==f || indiceActivo!==grupoElegido){
      // No mostrar indefinidamente la imagen de una franja anterior.
      // La superficie sólida sigue disponible mientras se descarga la siguiente.
      ocultarFondos();
      await mostrarNumero(grupoElegido,f);
    }
    if(anticipo?.franja===f)anticipo=null;
    programarAnticipo();
  }
  // A 45 segundos del siguiente cambio, consultar y decodificar una sola foto.
  // Esto se ejecuta fuera de la navegación y evita trabajo intenso en el cambio horario.
  function programarAnticipo(){
    clearTimeout(temporizadorAnticipo);

    if(!estado?.iniciado)return;
    temporizadorAnticipo=setTimeout(()=>{void prepararSiguiente();},
      Math.max(1000,estado.restante()-45000));
  }
  async function prepararSiguiente(){
    if(document.hidden)return;
    if(document.activeElement?.id==='comando'){
      temporizadorAnticipo=setTimeout(()=>{void prepararSiguiente();},4500);
      return;
    }
    const id=++revisionAnticipo, f=franjaActual();
    if(f===null)return;
    const siguiente=f+1;
    const lista=await obtenerListado();
    if(id!==revisionAnticipo||franjaActual()!==f)return;
    const consecutivosDisponibles=consecutivos(lista);
    const seleccion=seleccionParaFranja(siguiente,consecutivosDisponibles.length);
    if(!seleccion){anticipo={franja:siguiente,grupos:lista};return;}
    const grupoElegido=consecutivosDisponibles[seleccion.imagen-1];
    // Priorizar una sola variante. La selección normal conserva sus respaldos.
    const variante=ordenarPorResolucion(lista.get(grupoElegido)||[])[0];
    const info=variante?await precargar(variante.ruta):null;
    if(id!==revisionAnticipo||franjaActual()!==f)return;
    anticipo={franja:siguiente,grupos:lista,numero:grupoElegido,
      ruta:variante?.ruta||'',info};
  }
  function programarSincronizacion(){
    if(trabajoPendiente)return;

  window.__pruebaImagenes={
    estado:()=>({grupo:indiceActivo,franja:franjaMostrada,cantidad:grupos.size,ruta:rutaActiva,
      opacidad:OPACIDAD_FOTOGRAFIA,paneo:!!paneo,dimensiones}),
    analizarRuta,ordenarPorResolucion,consecutivos,seleccionParaFranja,calcularRecorte,

  requestAnimationFrame(programarSincronizacion);

    const espera=setTimeout(volar,1510);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(espera);clearTimeout(salidaSegura);limpiar();}},{once:true});
    reducido.addEventListener?.('change',e=>{if(e.matches){clearTimeout(espera);clearTimeout(salidaSegura);limpiar();}},{once:true});
  })();
</script>
