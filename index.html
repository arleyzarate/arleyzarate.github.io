<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#312F30">

  <meta name="description" content="Recursos | Arley Zarate. Herramientas y archivos con búsqueda en tiempo real.">
  <title>Recursos | Arley Zarate</title>
  <!-- La interfaz esencial es visible desde el primer renderizado. -->
  <style>
    :root {
      color-scheme: dark;
      --fondo: #312F30;
      --fondo-alt: #1d1f22;
      --panel: rgba(25, 29, 34, .90);
      --panel-solido: #171b20;
      --panel-secundario: rgba(255,255,255,.045);
      --texto: #f3efe7;
      --texto-suave: #d8d2c6;
      --texto-apagado: #a8b2ba;
      --texto-contraste: #111417;
      --borde: rgba(255,255,255,.12);
      --borde-fuerte: rgba(235, 91, 56, .40);
      --acento: #eb5b38;
      --acento-2: #347ccb;
      --acento-3: #e6e4dc;
      --boton: rgba(235, 91, 56, .18);
      --boton-hover: rgba(235, 91, 56, .32);
      --exito: #8ff3c0;
      --error: #ffb4a7;
      --info: #d2d9df;
      --lluvia: rgba(230, 228, 220, .58);
      --lluvia-brillo: #fff6ef;
      --lluvia-sombra: rgba(235, 91, 56, .24);
      --marca: #ffffff;
      --seleccion: rgba(255,255,255,.08);
      --resaltado: #fff0cf;
      --firma-referencia-stroke: var(--panel);
      --firma-contorno-stroke: var(--borde-fuerte);
      --firma-hueco-borde: var(--borde-fuerte);
      --firma-hueco-relleno: var(--fondo);
      --fuente-ui: "Bahnschrift Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", "Roboto Condensed", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      --fuente-mono: Consolas, "Cascadia Code", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--fondo);
      /* Cambio atómico: evita letras oscuras sobre fondos aún oscuros. */
      transition: none;
      color: var(--texto);
      font-family: var(--fuente-ui);
      overflow-x: hidden;
      position: relative;
    }
    /* Fotografías centradas: cover usa la escala necesaria para cubrir toda la
       ventana sin franjas. Las capas rotan cada 30 minutos sobre el fondo sólido. */
    .fondo-imagen {
      position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%;
      background-position: center center; background-size: cover;
      background-repeat: no-repeat; pointer-events: none; opacity: 0;
      visibility: hidden;
      transition: opacity .85s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .fondo-imagen { transition: none; }
    }
    .pagina {
      min-height: 100svh; position: relative; z-index: 2;
      padding: clamp(18px, 3vw, 45px);
      display: grid; grid-template-rows: auto 1fr auto;
    }
    .cabecera, .pie { font-size: 11px; font-weight: 700; letter-spacing: .19em; color: var(--texto-suave); }
    .cabecera { display: flex; align-items: center; gap: 10px; }
    .logotipo {
      display: grid; place-items: center; width: 29px; height: 29px;
      border: 1px solid var(--borde-fuerte); border-radius: 9px; color: var(--marca);
      background: color-mix(in srgb, var(--panel-solido) 86%, var(--acento) 14%); font-size: 14px;
    }
    .centro { width: min(690px, 100%); justify-self: center; align-self: center; transform: translateY(-8%); }
    h1 {
      margin: 0 0 48px; text-align: center;
      font-size: clamp(48px, 8vw, 88px); line-height: 1.05;
      font-weight: 700; letter-spacing: -.062em;
      text-shadow: 0 9px 38px rgba(0,0,0,.36);
    }
    .comandos {
      position: relative; display: flex; align-items: center; gap: 12px;
      min-height: 79px; padding: 8px 12px;
      border: 1px solid var(--borde-fuerte); border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 20px 64px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.06), 0 0 0 1px color-mix(in srgb, var(--acento) 12%, transparent);
      backdrop-filter: blur(13px);
    }
    .etiqueta {
      position: absolute; left: 22px; top: -13px;
      padding: 5px 11px; background: color-mix(in srgb, var(--panel-solido) 85%, var(--acento) 15%);
      border: 1px solid var(--borde-fuerte); border-radius: 7px;
      color: var(--marca); box-shadow: 0 7px 18px rgba(0,0,0,.4);
      font: 700 11px/1.2 var(--fuente-mono); letter-spacing: .07em;
      animation: flotar 3.8s ease-in-out infinite;
    }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .simbolo { padding-left: 13px; font: 800 25px var(--fuente-mono); color: var(--acento-lectura); }
    #comando {
      min-width: 0; flex: 1; padding: 12px 3px; background: transparent;
      outline: none; border: none; color: var(--texto); caret-color: var(--acento);
      font: 700 clamp(16px, 2vw, 19px)/1.1 var(--fuente-ui); letter-spacing: .02em; text-transform: none;
    }
    #comando::placeholder { color: var(--texto-apagado); opacity: 1; }
    .abrir {
      flex: 0 0 auto; width: 48px; height: 48px;
      border-radius: 11px; border: 1px solid var(--borde-fuerte);
      background: var(--boton); color: var(--marca);
      font-size: 21px; cursor: pointer; transition: background .2s ease;
    }
    .abrir:hover, .abrir:focus-visible { background: var(--boton-hover); outline: 2px solid color-mix(in srgb, var(--acento) 58%, transparent); }
    .estado {
      min-height: 28px; padding-top: 12px; text-align: center;
      font: 700 13px/1.35 var(--fuente-ui); text-transform: uppercase; letter-spacing: .08em;
      color: transparent;
      text-shadow: 0 2px 15px rgba(0,0,0,.6);
    }
    .estado.correcto { color: var(--exito); }
    .estado.error { color: var(--error); }
    .pie { font-size: 10px; text-align: left; letter-spacing: .08em; font-weight: 600; }
    @media (max-width: 560px) {
      .pagina { padding: 20px 15px; }
      .centro { transform: translateY(-5%); }
      h1 { margin-bottom: 42px; }
      .comandos { min-height: 67px; padding: 7px; gap: 6px; }
      .etiqueta { left: 15px; }
      .simbolo { padding-left: 9px; }
      .abrir { width: 43px; height: 43px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .etiqueta { animation: none; }
      body { transition: none; }
    }
  
    /* La interfaz deja solamente el nombre, el comando y los resultados. */
    .pagina { display: flex; align-items: center; justify-content: center; }
    .centro { width: min(720px,100%); align-self: auto; justify-self: auto; transform: translateY(-7%); position:relative; isolation:isolate; }
    /* Velo monocromático local para diferenciar la firma de las columnas traseras. */
    .centro::before {
      content:""; position:absolute; inset:-45px 0; z-index:-1; pointer-events:none;
      background: radial-gradient(ellipse at center, var(--fondo) 17%, transparent 76%);
    }
    .comandos { z-index: 3; }
    .etiqueta { display: none; }
    #comando { position: relative; z-index: 1; }
    .indicacion {
      position: absolute; pointer-events: none; user-select: none;
      left: 64px; right: 69px; top: 50%; transform: translateY(-50%);
      font: 700 clamp(16px, 2vw, 19px)/1.1 var(--fuente-ui);
      color: var(--texto-apagado); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden;
    }
    .cursor-parpadeo { color: var(--acento-lectura); font-family: var(--fuente-mono); font-weight: 700; animation: parpadear 1s steps(1) infinite; }
    @keyframes parpadear { 0%, 49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .indicacion.oculta { display: none; }
    .etiqueta-oculta { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .panel-resultados { position: relative; z-index: 2; }
    .resultados {
      position: absolute; top: 8px; left: 0; right: 0;
      max-height: min(330px, 44vh); overflow-y: auto;
      background: color-mix(in srgb, var(--panel-solido) 92%, transparent); border: 1px solid var(--borde-fuerte);
      border-radius: 15px; padding: 7px;
      box-shadow: 0 16px 54px rgba(0,0,0,.53); backdrop-filter: blur(18px);
      scrollbar-color: color-mix(in srgb, var(--acento) 50%, #3f4b52) transparent;
    }
    .resultados[hidden], .modal[hidden] { display: none !important; }
    .resultado {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: var(--texto); background: transparent; border: none; border-radius: 9px;
      cursor: pointer; font: 700 14px/1.28 var(--fuente-ui); text-transform: uppercase; letter-spacing: .04em;
      text-align: left; padding: 10px 12px;
    }
    .resultado:hover, .resultado.activo { background: var(--seleccion); }
    .resultado .archivo { min-width: 0; overflow: hidden; overflow-wrap: anywhere; }
    .resultado .nombre { display: block; }
    .resultado .ubicacion { display: block; margin-top: 4px; color: var(--texto-apagado); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: none; }
    .resultado mark { color: var(--texto-contraste); background: color-mix(in srgb, var(--resaltado) 84%, white 16%); border-radius: 3px; padding: 0 2px; }
    .resultado .accion { color: var(--acento-lectura); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .estado { min-height: 31px; }
    .estado.info { color: var(--info); }
    .modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px; background: rgba(0,0,0,.58); backdrop-filter: blur(8px); }
    .cuadro-modal { width: min(460px,100%); padding: 27px; border-radius: 19px; border: 1px solid var(--borde-fuerte); background: var(--panel-solido); box-shadow: 0 18px 70px rgba(0,0,0,.35); }
    .cuadro-modal h2 { margin: 0 0 12px; font-size: 21px; line-height: 1.15; font-weight: 800; font-family: var(--fuente-ui); text-transform: uppercase; letter-spacing: .04em; }
    .cuadro-modal p { line-height: 1.5; font-size: 15px; overflow-wrap: anywhere; color: var(--texto-suave); }
    .botones-modal { display: flex; gap: 11px; justify-content: flex-end; margin-top: 25px; }
    .botones-modal button { padding: 11px 17px; border-radius: 9px; border: 1px solid var(--borde); font: 800 14px var(--fuente-ui); color: var(--texto); background: color-mix(in srgb, var(--panel-solido) 86%, var(--acento-2) 14%); cursor: pointer; text-transform: uppercase; letter-spacing: .05em; }
    .botones-modal .confirmar { background: var(--acento); color: var(--texto-contraste); border-color: color-mix(in srgb, var(--acento) 70%, black 30%); }
    .botones-modal button:focus-visible, .resultado:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
    @media (max-width:560px) {
      .centro { transform: translateY(-6%); }
      .indicacion { left: 49px; right: 55px; }
      .resultado { padding: 10px 8px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { .cursor-parpadeo { animation: none; } }
    .comandos {
      animation: aparecer-barra .85s 1.3s cubic-bezier(.16,1,.3,1) both;
      overflow: hidden;
    }
    .comandos::after {
      content: ""; position: absolute; inset: 0 auto 0 0; z-index: 0;
      width: 36%; pointer-events: none; opacity: 0;
      background: linear-gradient(90deg,transparent,color-mix(in srgb, var(--acento) 28%, transparent),transparent);
      transform: translateX(-120%);
      animation: barrido-entrada .95s 1.7s ease-out both;
    }
    .comandos > * { z-index: 1; }
    @keyframes aparecer-barra {
      0% { opacity: 0; transform: translateY(26px) scale(.93); filter: blur(9px); }
      66% { opacity: 1; transform: translateY(-3px) scale(1.01); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes barrido-entrada {
      0%, 10% { opacity: 0; transform: translateX(-120%); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translateX(400%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .comandos, .comandos::after { animation: none !important; }
    }

    /* Firma Fourier: reemplaza exclusivamente el texto anterior del título.
       Su referencia permanece legible durante todo el ciclo y los diez fondos. */
    .titulo-firma {
      position: relative; width: 100%; height: auto; aspect-ratio: 1000 / 260;
      margin: 0 0 clamp(8px, 1.7vw, 16px);
      line-height: 1; font-size: inherit; overflow: hidden; isolation: isolate;
    }
    .firma-svg {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      pointer-events: none; overflow: visible; transition: opacity .4s ease;
    }
    /* La firma replica el fondo y el borde de la barra, con sus mismas variables. */
    #firma-contorno {
      opacity: 1;
    }
    #firma-contorno path {
      fill: none; stroke: var(--firma-contorno-stroke); stroke-width: 45;
      stroke-linecap: round; stroke-linejoin: round; opacity: 1;
    }
    #firma-referencia { opacity: 1; filter: none; }
    #firma-referencia path {
      fill: none; stroke: var(--firma-referencia-stroke); stroke-width: 30;
      stroke-linecap: round; stroke-linejoin: round; opacity: 1;
    }
    .titulo-firma.trazo-activo #firma-contorno,
    .titulo-firma.trazo-activo #firma-referencia { opacity: 1; }
    /* Cavidades internas: borde igual al buscador, centro transparente visualmente
       mediante el mismo fondo general que rodea las letras. */
    #firma-referencia #firma-huecos path,
    #firma-referencia #firma-huecos ellipse {
      fill: var(--firma-hueco-relleno); stroke: var(--firma-hueco-borde);
      stroke-width: 5.4; stroke-linecap: round; stroke-linejoin: round; opacity: 1;
      filter: none;
    }
    /* El mecanismo completo usa la pantalla, nunca el rectángulo del nombre. */
    #firma-escena {
      position: fixed; inset: 0; display: block; width: 100%; height: 100%;
      pointer-events: none; z-index: 4; opacity: 0;
    }
    #firma-escena.animacion-lista { opacity: 1; }
    .titulo-firma { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      #firma-escena { display: none; }
      #firma-contorno, #firma-referencia, .titulo-firma.trazo-activo #firma-contorno, .titulo-firma.trazo-activo #firma-referencia {
        opacity: 1 !important; transition: none;
      }
    }

    .resultado .nombre, .estado, .cuadro-modal h2, .botones-modal button, .indicacion, #comando { font-family: var(--fuente-ui); }
    .resultado .nombre { font-weight: 800; }
    .indicacion { font-stretch: condensed; font-weight: 800; }
    .comandos:focus-within { border-color: var(--acento); }
    #firma-referencia path { paint-order: stroke; }
    .tema-claro .resultado .accion, .tema-claro .simbolo { text-shadow: none; }
    .tema-claro .cuadro-modal, .tema-claro .resultados, .tema-claro .comandos {
      box-shadow: 0 20px 58px rgba(27, 32, 41, .12), inset 0 1px rgba(255,255,255,.32);
    }
    .tema-claro #comando, .tema-claro .estado, .tema-claro .resultado, .tema-claro .cuadro-modal h2 { text-shadow: none; }
    @media (max-width: 600px) {
      .comandos, .resultados { backdrop-filter: none; }
      .resultados { box-shadow: 0 14px 32px rgba(0,0,0,.20); }
    }


    /* Portal sobrio: sin letras verticales. Firma Fourier independiente del buscador. */
    .pagina { display: block; position: static; z-index: auto; padding: 0; min-height: 100svh; }
    .titulo-firma {
      position: fixed; right: calc(clamp(12px, 2.3vw, 30px) + var(--firma-vista-derecha, 0px));
      left: auto; top: calc(clamp(12px, 1.6vw, 24px) + var(--firma-vista-superior, 0px));
      z-index: 2; width: min(360px, calc(50vw - 16px));
      height: auto; margin: 0; pointer-events: none; overflow: visible;
    }
    /* Escritorio: barra en el tercer cuarto de la altura. Móvil: al borde inferior. */
    .centro {
      position: fixed; z-index: 5; left: 50%; top: var(--buscador-y, 75dvh);
      transform: translate(-50%, -50%) !important;
      transition: top .32s cubic-bezier(.2,.75,.2,1);
      width: min(720px, calc(100vw - 32px));
      margin: 0; isolation: initial; align-self: auto;
    }
    .centro::before { display: none; }
    .comandos { overflow: hidden; }
    /* Las sugerencias se despliegan hacia arriba y nunca detrás del teclado. */
    .panel-resultados {
      position: absolute; bottom: calc(100% + 10px); top: auto;
      left: 0; right: 0; z-index: 6;
    }
    .resultados {
      position: relative; top: auto; left: auto; right: auto;
      max-height: var(--resultados-alto, min(330px, 40dvh));
      overflow-y: auto; overscroll-behavior: contain;
      box-shadow: 0 -16px 40px rgba(0,0,0,.22);
    }
    .estado { pointer-events: none; }
    .indicacion { overflow: hidden; text-overflow: clip; }
    @media (max-width: 700px) {
      .centro { top: var(--buscador-y, calc(100dvh - 64px)); }
       .titulo-firma { width: min(360px, calc(50vw - 18px)); }
      .comandos { min-height: 62px; }
      #comando { font-size: 16px; }
      .indicacion { font-size: clamp(14px, 4vw, 18px); }
      .resultados { max-height: var(--resultados-alto, min(46dvh, 340px)); }
      .estado { min-height: 20px; padding-top: 6px; font-size: 11px; }
    }

    /* El buscador mantiene la pista de texto o muestra un alcance real por carpeta. */
    .alcance-actual { display:flex; align-items:center; flex:0 1 auto; gap:8px;
      min-width:0; white-space:nowrap; color:var(--texto-apagado);
      font:800 clamp(12px,1.6vw,16px)/1.1 var(--fuente-ui); text-transform:uppercase; }
    .alcance-actual[hidden] { display:none !important; }
    .carpeta-etiqueta { display:inline-flex; align-items:center; gap:6px; min-width:0; max-width:210px;
      color:var(--acento-lectura); background:color-mix(in srgb,var(--acento) 12%,transparent);
      border:1px solid var(--borde-fuerte); border-radius:9px;
      padding:7px 8px; font:inherit; font-weight:800; cursor:pointer; }
    .carpeta-etiqueta:focus-visible { outline:2px solid var(--acento); outline-offset:2px; }
    #nombre-carpeta { display:block; max-width:175px; overflow:hidden; text-overflow:ellipsis; }
    .carpeta-etiqueta .quitar { font-size:18px; line-height:1; }
    .comandos.con-alcance #comando { flex:1 1 50px; min-width:34px; }
    .resultado.tipo-carpeta { border-left:2px solid var(--borde-fuerte); }
    .resultado.tipo-carpeta .accion { white-space:nowrap; }
    @media (max-width:600px) {
      .alcance-actual { gap:5px; font-size:12px; }
      .carpeta-etiqueta { padding:6px; max-width:120px; }
      #nombre-carpeta { max-width:89px; }
      .comandos.con-alcance { gap:5px; }
      .comandos.con-alcance .simbolo { padding-left:5px; }
      .comandos.con-alcance #comando { padding-inline:0; font-size:14px; }
    }
    @media (max-width:360px) {
      .comandos.con-alcance { gap:3px; padding-inline:5px; }
      .comandos.con-alcance .simbolo { padding-left:2px; font-size:21px; }
      .comandos.con-alcance .abrir { width:38px; height:41px; }
      .alcance-actual { gap:3px; font-size:11px; }
      .carpeta-etiqueta { gap:3px; max-width:117px; padding:5px; }
      #nombre-carpeta { max-width:94px; }
      .comandos.con-alcance #comando { min-width:23px; flex-basis:25px; font-size:13px; }
    }
    @media (prefers-reduced-motion:reduce) { .centro { transition:none !important; } }

</style>

  <script>
    'use strict';
    // Se usan 10 temas alternados por horario de Colombia, sin cambios visibles
    // mientras la pagina permanece abierta. Se preservan los colores de las
    // referencias de Arley y se asignan cinco fondos oscuros y cinco claros.
    const PALETAS = [
      { nombre:'01 · Grafito fuerte', modo:'oscuro', fondo:'#312F30', panel:'#0E0F0B', acento:'#FFD85E', acentoTexto:'#FFD85E', secundario:'#7477FF', tinta:'#FFD85E', orbita:'#FFFFFF', eje:'#FFD85E', referencia:'#FFFFFF', lluvia:'#FFFFFF', lluviaBrillo:'#FFD85E' },
      { nombre:'02 · Blanco técnico', modo:'claro', fondo:'#FFFFFF', panel:'#FFFFFF', acento:'#C34C3F', acentoTexto:'#A33C30', secundario:'#F66554', tinta:'#9D342D', orbita:'#312F30', eje:'#0E0F0B', referencia:'#312F30', lluvia:'#312F30', lluviaBrillo:'#0E0F0B' },
      { nombre:'03 · Negro profundo', modo:'oscuro', fondo:'#0E0F0B', panel:'#312F30', acento:'#FE813C', acentoTexto:'#FEAD77', secundario:'#F9CD61', tinta:'#FFBA87', orbita:'#FFFFFF', eje:'#FEAD77', referencia:'#FFFFFF', lluvia:'#FFFFFF', lluviaBrillo:'#FE813C' },
      { nombre:'04 · Salvia clara', modo:'claro', fondo:'#C5D4CA', panel:'#FFFFFF', acento:'#385B45', acentoTexto:'#30513C', secundario:'#727E6E', tinta:'#31553F', orbita:'#312F30', eje:'#0E0F0B', referencia:'#312F30', lluvia:'#312F30', lluviaBrillo:'#0E0F0B' },
      { nombre:'05 · Carbón esencial', modo:'oscuro', fondo:'#303030', panel:'#0E0F0B', acento:'#F9CD61', acentoTexto:'#F9CD61', secundario:'#7477FF', tinta:'#FFD85E', orbita:'#FFFFFF', eje:'#F9CD61', referencia:'#FFFFFF', lluvia:'#FFFFFF', lluviaBrillo:'#F9CD61' },
      { nombre:'06 · Marfil sobrio', modo:'claro', fondo:'#FBEDB9', panel:'#FFFFFF', acento:'#303030', acentoTexto:'#303030', secundario:'#F9CD61', tinta:'#303030', orbita:'#312F30', eje:'#0E0F0B', referencia:'#312F30', lluvia:'#312F30', lluviaBrillo:'#0E0F0B' },
      { nombre:'07 · Grafito azulado', modo:'oscuro', fondo:'#272A2D', panel:'#0E0F0B', acento:'#347CCB', acentoTexto:'#B2D7FF', secundario:'#FE813C', tinta:'#B2D7FF', orbita:'#FFFFFF', eje:'#C3E0FF', referencia:'#FFFFFF', lluvia:'#FFFFFF', lluviaBrillo:'#B2D7FF' },
      { nombre:'08 · Amarillo luminoso', modo:'claro', fondo:'#FFD85E', panel:'#FFFFFF', acento:'#303030', acentoTexto:'#303030', secundario:'#7477FF', tinta:'#312F30', orbita:'#312F30', eje:'#0E0F0B', referencia:'#312F30', lluvia:'#312F30', lluviaBrillo:'#0E0F0B' },
      { nombre:'09 · Violeta profundo', modo:'oscuro', fondo:'#262535', panel:'#0E0F0B', acento:'#7477FF', acentoTexto:'#B5B7FF', secundario:'#F9CD61', tinta:'#B5B7FF', orbita:'#FFFFFF', eje:'#B5B7FF', referencia:'#FFFFFF', lluvia:'#FFFFFF', lluviaBrillo:'#7477FF' },
      { nombre:'10 · Naranja aventura', modo:'claro', fondo:'#FE813C', panel:'#FFFFFF', acento:'#312F30', acentoTexto:'#312F30', secundario:'#727E6E', tinta:'#0E0F0B', orbita:'#0E0F0B', eje:'#0E0F0B', referencia:'#0E0F0B', lluvia:'#0E0F0B', lluviaBrillo:'#0E0F0B' }
    ];
    // Diez grupos numerados, oscuro/claro intercalados cada 30 minutos.
    // El día de Colombia participa en el índice: las 48 franjas de un día
    // desplazan el punto inicial del día siguiente en la secuencia de 10.
    // Se usa el reloj del dispositivo con zona America/Bogota (UTC-5 sin DST).
    const MS_MEDIA_HORA = 30 * 60 * 1000;
    const MS_COLOMBIA = 5 * 60 * 60 * 1000;
    const metaThemeColor = document.querySelector('meta[name="theme-color"]');
    const metaColorScheme = document.querySelector('meta[name="color-scheme"]');
    const rootStyle = document.documentElement.style;
    function fechaHoraColombia(fecha = new Date()) {
      try {
        const partes = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'America/Bogota', year: 'numeric', month: '2-digit',
          day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        }).formatToParts(fecha);
        const campos = Object.fromEntries(partes.filter(p => p.type !== 'literal')
          .map(p => [p.type, Number(p.value)]));
        if (Number.isInteger(campos.year) && Number.isInteger(campos.month) &&
            Number.isInteger(campos.day) && campos.hour >= 0 && campos.hour <= 23) {
          return campos;
        }
      } catch (_) { /* Respaldo UTC−5 si faltan datos de zona horaria. */ }
      const col = new Date(fecha.getTime() - MS_COLOMBIA);
      return {year: col.getUTCFullYear(), month: col.getUTCMonth()+1,
        day: col.getUTCDate(), hour: col.getUTCHours(), minute: col.getUTCMinutes()};
    }
    function numeroFranjaColombia(fecha = new Date()) {
      const f = fechaHoraColombia(fecha);
      const dia = Math.floor(Date.UTC(f.year, f.month-1, f.day) / 86400000);
      return dia * 48 + f.hour * 2 + Math.floor(f.minute / 30);
    }
    function indiceTemaColombia(fecha = new Date()) {
      const franja = numeroFranjaColombia(fecha);
      return ((franja % PALETAS.length) + PALETAS.length) % PALETAS.length;
    }
    function aplicarPaleta(p) {
      const clara = p.modo === 'claro';
      const reglas = {
        '--fondo': p.fondo,
        '--panel': clara ? 'rgba(255,255,255,.94)' : p.panel,
        '--panel-solido': p.panel,
        '--texto': clara ? '#202226' : '#F6F6F4',
        '--texto-suave': clara ? '#414449' : '#E7E8E4',
        '--texto-apagado': clara ? '#515962' : '#C4CCD2',
        '--texto-contraste': clara ? '#FFFFFF' : '#16171A',
        '--borde': clara ? 'rgba(23,26,28,.20)' : 'rgba(255,255,255,.22)',
        '--borde-fuerte': p.acento,
        '--acento': p.acento,
        '--acento-2': p.secundario,
        '--acento-3': p.secundario,
        '--acento-lectura': p.acentoTexto,
        '--boton': clara ? 'rgba(60,63,69,.06)' : 'rgba(255,255,255,.08)',
        '--boton-hover': clara ? 'rgba(60,63,69,.14)' : 'rgba(255,255,255,.17)',
        '--exito': clara ? '#237447' : '#A3F4C8',
        '--error': clara ? '#A52228' : '#FFC0BC',
        '--info': clara ? '#48535C' : '#D6E0E5',
        '--lluvia': p.lluvia,
        '--lluvia-brillo': p.lluviaBrillo,
        '--lluvia-sombra': clara ? 'rgba(0,0,0,.15)' : 'rgba(255,255,255,.19)',
        '--marca': clara ? '#17191B' : '#FFFFFF',
        '--seleccion': clara ? 'rgba(19,24,28,.085)' : 'rgba(255,255,255,.12)',
        '--resaltado': clara ? '#FFE19B' : '#FDF4CE',
      };
      for (const [propiedad, valor] of Object.entries(reglas)) rootStyle.setProperty(propiedad, valor);
      window.RECURSOS_PALETA_ACTUAL = p;
      document.body.classList.toggle('tema-claro', clara);
      document.documentElement.style.colorScheme = clara ? 'light' : 'dark';
      document.body.dataset.paleta = p.nombre;
      if (metaThemeColor) metaThemeColor.content = p.fondo;
      if (metaColorScheme) metaColorScheme.content = clara ? 'light' : 'dark';
    }
    // El horario se comprueba al inicio, al recuperar la pestaña y al llegar
    // a la siguiente media hora colombiana. No se usa una animación de cortina.
    let indicePaleta = -1;
    let temporizadorTema = 0;
    function actualizarTema() {
      const siguiente = indiceTemaColombia();
      if (siguiente !== indicePaleta) {
        indicePaleta = siguiente;
        aplicarPaleta(PALETAS[indicePaleta]);
        window.dispatchEvent(new CustomEvent('recursos:cambio-paleta', {
          detail: {franja: numeroFranjaColombia(), indice: indicePaleta}
        }));
      }
      clearTimeout(temporizadorTema);
      const transcurrido = ((Date.now() - MS_COLOMBIA) % MS_MEDIA_HORA + MS_MEDIA_HORA) % MS_MEDIA_HORA;
      temporizadorTema = setTimeout(actualizarTema, Math.max(1000, MS_MEDIA_HORA-transcurrido+80));
    }
    actualizarTema();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) clearTimeout(temporizadorTema);
      else actualizarTema();
    });
    window.__pruebaPaletas = {
      total: PALETAS.length,
      actual: () => document.body.dataset.paleta,
      indice: () => indicePaleta,
      grupo: () => indicePaleta + 1,
      fechaHoraColombia,
      franjaParaFecha: numeroFranjaColombia,
      temaParaFecha: fecha => PALETAS[indiceTemaColombia(fecha)].nombre,
      indiceParaFecha: indiceTemaColombia,
      alternancia: PALETAS.map(p => p.modo),
      actualizar: actualizarTema,
      transicionActiva: false
    };

    const formulario = document.getElementById('formulario');
    const entrada = document.getElementById('comando');
    const estado = document.getElementById('estado');
    const resultados = document.getElementById('resultados');
    const indicacion = document.getElementById('indicacion');
    const alcanceActual = document.getElementById('alcance-actual');
    const quitarCarpeta = document.getElementById('quitar-carpeta');
    const nombreCarpeta = document.getElementById('nombre-carpeta');
    const modal = document.getElementById('modal');
    const nombreDescarga = document.getElementById('nombre-descarga');
    const botonSi = document.getElementById('descargar-si');
    const botonNo = document.getElementById('descargar-no');


    // Un teclado táctil puede reducir el área visible sin cambiar innerHeight.
    // Por eso se usa VisualViewport cuando existe y, como respaldo, resize.
    // Ningún navegador garantiza abrir el teclado sin un gesto del usuario.
    const vistaVisual = window.visualViewport;
    const sitioBuscador = document.querySelector('.centro');
    const modoTactil = window.matchMedia('(pointer: coarse)');
    let altoReferencia = Math.max(window.innerHeight, vistaVisual?.height || 0);
    let reajustePendiente = 0;
    let tecladoVisible = false;
    function ajustarBuscador() {
      reajustePendiente = 0;
      const movil = window.innerWidth <= 700 || (modoTactil.matches && window.innerWidth <= 1024);
      const escala = vistaVisual?.scale || 1;
      const superior = vistaVisual?.offsetTop || 0;
      const visible = vistaVisual?.height || window.innerHeight;
      const bordeInferior = superior + visible;
      // El logo no pertenece al buscador: se fija a la esquina visible,
      // incluso si el navegador desplaza el viewport al mostrar el teclado.
      const derechaVisible = Math.max(0, window.innerWidth -
        ((vistaVisual?.offsetLeft || 0) + (vistaVisual?.width || window.innerWidth)));
      document.documentElement.style.setProperty('--firma-vista-superior',
        `${Math.round(Math.max(0, superior))}px`);
      document.documentElement.style.setProperty('--firma-vista-derecha',
        `${Math.round(derechaVisible)}px`);
      const focoBusqueda = document.activeElement === entrada;
      const geometria = navigator.virtualKeyboard?.boundingRect;
      const tecladoGeometrico = movil && focoBusqueda && !!(geometria && geometria.height > 110);
      if (!focoBusqueda && visible >= altoReferencia - 25) altoReferencia = Math.max(altoReferencia, visible);
      const reduccion = Math.max(altoReferencia, window.innerHeight) - visible;
      const probableTeclado = movil && focoBusqueda && escala < 1.2 &&
        reduccion > Math.max(120, altoReferencia * .18);
      tecladoVisible = tecladoGeometrico || probableTeclado;
      const alturaBarra = formulario.getBoundingClientRect().height || 68;
      const margenInferior = movil ? 16 : 20;
      const bordeUtil = tecladoGeometrico ? Math.min(bordeInferior, geometria.top) : bordeInferior;
      // La barra arranca abajo en móvil y acompaña al teclado cuando aparece.
      // En escritorio se coloca a 3/4 de la altura, dejando espacio arriba.
      const centro = movil
        ? Math.max(superior + alturaBarra/2 + 16, bordeUtil - margenInferior - alturaBarra/2)
        : superior + visible * .75;
      document.documentElement.style.setProperty('--buscador-y', `${Math.round(centro)}px`);
      document.body.classList.toggle('buscador-movil', movil);
      const disponibles = centro - alturaBarra/2 - superior - 18;
      document.documentElement.style.setProperty('--resultados-alto',
        `${Math.round(Math.max(52, Math.min(340, disponibles)))}px`);
      window.__sincronizarGeometriaFirma?.();
    }
    function programarAjuste() {
      if (!reajustePendiente) reajustePendiente = requestAnimationFrame(ajustarBuscador);
    }
    window.addEventListener('resize', programarAjuste, {passive:true});
    vistaVisual?.addEventListener('resize', programarAjuste, {passive:true});
    vistaVisual?.addEventListener('scroll', programarAjuste, {passive:true});
    navigator.virtualKeyboard?.addEventListener?.('geometrychange', programarAjuste);
    entrada.addEventListener('focus', programarAjuste);
    entrada.addEventListener('blur', programarAjuste);
    modoTactil.addEventListener?.('change', programarAjuste);
    // Foco inicial solo para teclado físico. En móvil, el toque abre el teclado
    // y la barra lo acompaña; no se intenta forzar la aparición de un IME.
    ajustarBuscador();
    if (!((window.innerWidth <= 700) || (modoTactil.matches && window.innerWidth <= 1024))) {
      entrada.focus({preventScroll:true});
    }
    requestAnimationFrame(programarAjuste);
    window.__pruebaTeclado = {
      estado: () => ({tecladoVisible, y: sitioBuscador.getBoundingClientRect().top,
        barra: formulario.getBoundingClientRect().toJSON(),
        resultados: resultados.getBoundingClientRect().toJSON(),
        visual: {alto: vistaVisual?.height || window.innerHeight, superior: vistaVisual?.offsetTop || 0}}),
      ajustar: ajustarBuscador
    };

    // Buscador publicado en el sitio personal: los recursos viven en OTRO repositorio.
    const CONFIG_GITHUB = {
      usuario: 'arleyzarate',
      repositorio: 'recursos',
      carpeta: '',
      rama: ''
    };
    const URL_RECURSOS = 'https://arleyzarate.github.io/recursos/';
    const EXCLUIDOS = /^(?:index(?:\.|$)|leame(?:[._\- ]|$)|readme(?:[._\- ]|$)|actualizar(?:[._\- ]|$)|archivos(?:[._\- ]|$)|archivos_archivos(?:[._\- ]|$)|palabras(?:[._\- ]|$)|catalogo(?:[._\- ]|$)|license(?:\.|$)|\.nojekyll$|\.gitignore$|\.ds_store$|recursos_web_arley_zarate(?:[._\- ]|$))/i;
    const CARPETAS_TECNICAS = /^(?:\.github|\.git|node_modules|__pycache__)$/i;
    const normalizar = texto => String(texto || '').normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es-CO');
    const simplificar = texto => normalizar(texto).replace(/[\s_\-]+/g, '');
    // El catálogo puede contener código: solo mostrar formatos autorizados por extensiones.js.
    // Si faltara el archivo de configuración, se usa un mínimo seguro.
    const EXTENSIONES_PERMITIDAS = new Set(
      (Array.isArray(window.RECURSOS_EXTENSIONES) ? window.RECURSOS_EXTENSIONES :
        ['.html', '.htm', '.pdf', '.dwg', '.dxf', '.lsp'])
      .map(valor => String(valor).trim().toLowerCase().replace(/^\.?/, '.'))
      .filter(valor => /^\.[a-z0-9]+$/.test(valor))
    );
    // Exclusión adicional del código propio, incluso si se incluye por error en la lista.
    const EXTENSIONES_CODIGO = new Set([
      '.js', '.mjs', '.cjs', '.css', '.map', '.json', '.ts', '.tsx', '.jsx',
      '.yml', '.yaml', '.env', '.php', '.py', '.ps1', '.sh', '.bat'
    ]);
    const extensionDe = nombre => {
      const punto = nombre.lastIndexOf('.');
      return punto > 0 ? nombre.slice(punto).toLowerCase() : '';
    };
    const esHTML = nombre => /\.html?$/i.test(nombre);
    const esIndice = nombre => /^index\.html$/i.test(nombre);
    const nombreAmigable = nombre => nombre.replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    function rutaSegura(ruta) {
      if (typeof ruta !== 'string' || !ruta || /[\\\u0000-\u001f\u007f]/.test(ruta)) return false;
      const piezas = ruta.split('/');
      return piezas.every(p => p && p !== '.' && p !== '..' && !p.startsWith('.')) &&
        !piezas.slice(0, -1).some(p => CARPETAS_TECNICAS.test(p));
    }
    function crearEntrada(ruta) {
      if (!rutaSegura(ruta)) return null;
      const partes = ruta.split('/');
      const archivo = partes[partes.length - 1];
      const rutaCarpeta = partes.slice(0, -1).join('/');
      const extension = extensionDe(archivo);
      if (!EXTENSIONES_PERMITIDAS.has(extension) || EXTENSIONES_CODIGO.has(extension)) return null;
      // index.html de una carpeta representa la aplicación, no un archivo excluido.
      if (esIndice(archivo) && partes.length > 1) {
        const nombreCarpeta = partes[partes.length - 2];
        return {
          ruta, titulo: nombreAmigable(nombreCarpeta),
          ubicacion: partes.slice(0, -2).map(nombreAmigable).join(' / '),
          buscar: partes.slice(0, -1).map(nombreAmigable).join(' '),
          pagina: true, indice: true, descarga: ''
        };
      }
      if (EXCLUIDOS.test(archivo)) return null;
      const pagina = esHTML(archivo);
      return {
        ruta, titulo: pagina ? nombreAmigable(archivo.replace(/\.html?$/i, '')) : archivo,
        ubicacion: partes.slice(0, -1).map(nombreAmigable).join(' / '),
        buscar: rutaCarpeta.replace(/[/_\-]+/g, ' ') + ' ' + archivo + ' ' + (pagina ? archivo.replace(/\.html?$/i, '') : ''),
        pagina, indice: false, descarga: archivo
      };
    }
    function catalogoFiltrado(rutas) {
      const vistos = new Set();
      return rutas.map(crearEntrada).filter(entrada => {
        if (!entrada || vistos.has(entrada.ruta)) return false;
        vistos.add(entrada.ruta);
        return true;
      }).sort((a, b) => a.titulo.localeCompare(b.titulo, 'es', {numeric:true, sensitivity:'base'}) ||

    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{if(indiceActivo)void mostrarNumero(indiceActivo);},300);
  },{passive:true});
  window.__pruebaImagenes={
    estado:()=>({grupo:indiceActivo,franja:franjaAnterior,cantidad:grupos.size,ruta:rutaActiva,opacidad:.30}),
    analizarRuta,ordenarPorResolucion,consecutivos,
    simular:async rutas=>{
      const mapa=new Map();integrarRutas(rutas,mapa);grupos=mapa;iniciada=true;
      const f=franjaActual();franjaAnterior=f;
      if(consecutivos().length){const n=estadoParaFranja(f);guardarEstado({indice:n,franja:f});await mostrarNumero(n);}
      else ocultarFondos();
    }
  };
  // No bloquear ni el primer pintado ni las búsquedas por comprobar imágenes.
  requestAnimationFrame(()=>setTimeout(()=>{void sincronizar(true);},180));
})();
</script>

const STROKES=[[0, 168], [204, 241], [272, 318], [334, 370], [403, 485], [509, 646], [675, 765], [772, 852], [937, 1129], [1173, 1219], [1239, 1355], [1380, 1425], [1441, 1477], [1513, 1559], [1579, 1695], [1735, 1818], [1852, 1886], [1911, 2048]];
const TAU=Math.PI*2, M=2048, DURACION=21; // Ida y regreso: 10,5 segundos cada uno.
const contenedor=document.getElementById('firma');
 const canvas=document.getElementById('firma-escena');
if(!contenedor || !canvas || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.documentElement.classList.remove('recursos-preparando');return;
}
const ctx=canvas.getContext('2d',{alpha:true});
if(!ctx){document.documentElement.classList.remove('recursos-preparando');return;}
let W=0,H=0,dpr=1,escala=1,dx=0,dy=0;
let origenX=0,origenY=0,maquina=[],px,py;
let ciclo=-1,sentido=-1,t0=0,ultimoFotograma=0,raf=0,ocultaDesde=0,presentada=false,ultimoIndice=0;
const intervaloFotograma=window.innerWidth < 600 ? 1000/30 : 1000/45;
const anillosReutilizables=Array.from({length:66},()=>({x:0,y:0,nx:0,ny:0,r:0}));
function decode(b64){let binary=atob(b64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Float32Array(bytes.buffer)}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(devicePixelRatio||1,window.innerWidth<600?1.15:1.45);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  sincronizarGeometriaFirma();
}
function sincronizarGeometriaFirma(){
  const r=contenedor.getBoundingClientRect();
  escala=Math.min(r.width/1000,r.height/260,1.7);
  dx=r.left+(r.width-1000*escala)/2;
  dy=r.top+(r.height-260*escala)/2;
}
window.__sincronizarGeometriaFirma=sincronizarGeometriaFirma;
addEventListener('resize',resize,{passive:true});
function init(){try{
const cc=decode(COEFF), p=decode(PATHS);
for(let i=0;i<cc.length;i+=3){let k=cc[i],r=cc[i+1],im=cc[i+2];maquina.push({freq:k,r:Math.hypot(r,im),angle:Math.atan2(im,r)})}
origenX=522.0160177560647;origenY=132.8462180586847;
px=new Float32Array(M+1);py=new Float32Array(M+1);for(let i=0;i<=M;i++){px[i]=p[2*i];py[i]=p[2*i+1]}
resize();contenedor.classList.add('trazo-activo');t0=performance.now();
raf=requestAnimationFrame(frame);
}catch(e){/* La interfaz y la firma SVG siguen visibles sin el mecanismo. */}}
function begin(c,d){
  ciclo=c;sentido=d;
  if(d===0)window.dispatchEvent(new CustomEvent('firma:nuevo-ciclo',{detail:{ciclo:c}}));
}
// Firma Fourier: 66 brazos animados sin las circunferencias orbitales.
// Se conservan todos los coeficientes, los puntos del trazo y la ida/regreso.
// La letra es un trazado SVG, no texto tipográfico: su nuevo grosor se logra
// ajustando los anchos de trazo sin perder sincronización con la máquina.
function mecanismo(fase,index){let x=origenX,y=origenY;
  const limite=Math.min(maquina.length,66);
  for(let i=0;i<limite;i++){
    const c=maquina[i],a=TAU*fase*c.freq+c.angle;
    const nx=x+c.r*Math.cos(a),ny=y+c.r*Math.sin(a);
    const q=anillosReutilizables[i];
    q.x=x;q.y=y;q.nx=nx;q.ny=ny;q.r=c.r;
    x=nx;y=ny;
  }
  return {x:px[index],y:py[index],cx:x,cy:y,cs:anillosReutilizables,limite};
}
function dibujarBrazos(p){
  // Igual que la barra: color del borde, con 20 % de transparencia (80 % visible).
  const estilo=getComputedStyle(document.documentElement);
  const color=estilo.getPropertyValue('--borde-fuerte').trim() || '#FFD85E';
  const fondo=estilo.getPropertyValue('--panel').trim() || '#0E0F0B';
  const uniones=[];
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.globalAlpha=.8;
  ctx.strokeStyle=color;
  let lx=origenX,ly=origenY;
  for(let i=0;i<p.limite;i++){
    const q=p.cs[i];
    lx=q.nx;ly=q.ny;
    if(q.r*escala<.65)continue;
    ctx.lineWidth=i<8?4.2:2.9;
    ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.nx,q.ny);ctx.stroke();
    if(i<10 && q.r*escala>10)uniones.push({x:q.nx,y:q.ny,r:i<4?4.5:3.7});
  }
  ctx.lineWidth=4.3;
  ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();
  // Articulaciones rellenas con el MISMO fondo de las letras. No emiten chispas.
  ctx.globalAlpha=1;
  ctx.fillStyle=fondo;
  for(const punto of uniones){
    ctx.beginPath();ctx.arc(punto.x,punto.y,punto.r,0,TAU);ctx.fill();
    ctx.globalAlpha=.8;
    ctx.lineWidth=1.35;ctx.stroke();
    ctx.globalAlpha=1;
  }
  // Punta identificable, sin brillo ni partículas.
  ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,TAU);ctx.fill();
  ctx.globalAlpha=.8;ctx.lineWidth=1.35;ctx.stroke();
  ctx.restore();
}
function frame(time){
  raf=requestAnimationFrame(frame);
  if(document.hidden || time-ultimoFotograma<intervaloFotograma)return;
  ultimoFotograma=time;
  const sec=Math.max(0,(time-t0)/1000),real=sec/DURACION,c=Math.floor(real),u=real-c,d=u<.5?0:1;
  if(c!==ciclo||d!==sentido)begin(c,d);
  const progress=d===0?u*2:(1-u)*2;
  const index=Math.min(M,Math.max(0,Math.floor(progress*M)));
  ultimoIndice=index;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.setTransform(dpr*escala,0,0,dpr*escala,dpr*dx,dpr*dy);
  dibujarBrazos(mecanismo(progress*.5,index));
  if(!presentada){
    presentada=true;
    canvas.classList.add('animacion-lista');
  }
}
// Evita calcular y dibujar durante una pestaña oculta.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ocultaDesde=performance.now();cancelAnimationFrame(raf);raf=0;}
  else if(maquina.length){if(ocultaDesde)t0+=performance.now()-ocultaDesde;ocultaDesde=0;
    ultimoFotograma=0;if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);}
});
window.__pruebaFirma={estado:()=>({listo:maquina.length>0,armónicos:maquina.length,círculos:0,
  brazos:Math.min(maquina.length,66),letras:11,segmentos:STROKES.length,
  visible:presentada,tiempoCiclo:DURACION,sentido:sentido===0?'ida':'regreso',
  color:getComputedStyle(document.documentElement).getPropertyValue('--borde-fuerte').trim(),
  indice:ultimoIndice,chispas:0,tonos:[],grosorLetra:30,grosorMecanismo:4.2}),
  avanzar:(s)=>{t0=performance.now()-s*1000;ciclo=-1;sentido=-1;ultimoFotograma=0}};
// Firma estática visible desde el inicio. Animación diferida tras el primer renderizado.
function iniciarDiferido(){
  const ejecutar=()=>{try{init()}catch(_){/* La firma estática permanece disponible. */}};
  if('requestIdleCallback' in window)requestIdleCallback(ejecutar,{timeout:1700});
  else setTimeout(ejecutar,850);
}
requestAnimationFrame(()=>setTimeout(iniciarDiferido,350));
})();
